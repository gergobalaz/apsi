<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>apsi</title>
<style>
  :root {
    --bg: #000;
    --fg: rgb(54,181,38);
    --panel: rgba(20,20,24,0.72);
    --panel-border: rgb(54,181,38);
    --accent-pink: rgb(54,181,38);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* background video (muted, ambient) */
  .bg-wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 0;
  }
  .bg-wrap video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 56.25vw;
    min-height: 100vh;
    min-width: 177.78vh;
    transform: translate(-50%, -50%) scale(1.04);
    object-fit: cover;
    filter: blur(4px) saturate(105%);
    pointer-events: none;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1;
  }

  /* click-to-enter gate, needed so the audio track is allowed to start */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(28px) saturate(120%);
    -webkit-backdrop-filter: blur(28px) saturate(120%);
    cursor: default;
    transition: opacity .5s ease, visibility .5s ease;
  }
  #gate.ready { cursor: pointer; }
  #gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #gate .enter-text {
    color: #fff;
    font-size: clamp(1rem, 3vw, 1.5rem);
    letter-spacing: 8px;
    font-weight: 600;
    text-shadow: 0 0 25px rgba(255,95,162,0.6);
    animation: pulse 2.2s ease-in-out infinite;
    user-select: none;
  }
  #gate .loading-text {
    color: rgba(255,255,255,0.75);
    font-size: clamp(0.8rem, 2.4vw, 1.1rem);
    letter-spacing: 6px;
    font-weight: 500;
    text-shadow: 0 0 20px rgba(54,181,38,0.5);
    animation: pulse 1.4s ease-in-out infinite;
    user-select: none;
  }
  @keyframes pulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }

  .content {
    position: relative;
    z-index: 2;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3.5vh 16px 130px;
    color: var(--fg);
  }

  .avatar {
    width: 112px;
    height: 112px;
    border-radius: 50%;
    border: 2px solid var(--accent-pink);
    background: linear-gradient(135deg, #4a4a55, #2a2a30);
    box-shadow: 0 0 18px rgba(54,181,38,0.35);
    overflow: hidden;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }

  .name {
    margin-top: 20px;
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--accent-pink);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    text-transform: uppercase;
  }
  .handle { font-size: 0.92rem; opacity: 0.75; margin-top: 4px; }
  .location {
    font-size: 0.9rem;
    opacity: 0.9;
    margin-top: 16px;
    border: 1px solid rgba(54,181,38,0.55);
    color: var(--accent-pink);
    padding: 5px 16px;
    border-radius: 999px;
    display: inline-block;
    background: linear-gradient(135deg, rgba(54,181,38,0.14), rgba(20,20,24,0.35));
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 0 0 1px rgba(54,181,38,0.08), 0 4px 18px rgba(0,0,0,0.35);
  }
  .owner-badge {
    margin-top: 16px;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, rgba(54,181,38,0.14), rgba(20,20,24,0.35));
    border: 1px solid rgba(54,181,38,0.55);
    color: var(--accent-pink);
    padding: 4px 14px;
    border-radius: 999px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 0 0 1px rgba(54,181,38,0.08), 0 4px 18px rgba(0,0,0,0.35);
  }

  .bio {
    margin-top: 26px;
    text-align: center;
    font-size: 0.92rem;
    line-height: 1.55;
    opacity: 0.95;
    max-width: 420px;
    width: 100%;
    text-decoration: underline;
    text-transform: uppercase;
    background: linear-gradient(135deg, rgba(54,181,38,0.14), rgba(20,20,24,0.35));
    border: 1px solid rgba(54,181,38,0.55);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 0 0 1px rgba(54,181,38,0.08), 0 4px 18px rgba(0,0,0,0.35);
    box-sizing: border-box;
  }

  .stats { margin-top: 18px; font-size: 0.8rem; opacity: 0.55; }

  .links {
    width: 100%;
    max-width: 420px;
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(54,181,38,0.14), rgba(20,20,24,0.35));
    border: 1px solid rgba(54,181,38,0.55);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 0 0 1px rgba(54,181,38,0.08), 0 4px 18px rgba(0,0,0,0.35);
    color: var(--fg);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .link-btn:hover {
    background: linear-gradient(135deg, rgba(54,181,38,0.22), rgba(20,20,24,0.45));
    border-color: rgb(54,181,38);
  }
  .link-icon {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
    color: var(--accent-pink);
    text-decoration: none;
    background: rgba(54,181,38,0.12);
    border: 1px solid rgba(54,181,38,0.55);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
  }
  .link-icon svg { width: 15px; height: 15px; fill: rgb(54,181,38); }
  .link-btn span.label { flex: 1; }
  .chev { opacity: 0.4; font-size: 0.8rem; }

  .corner-badge {
    position: fixed;
    bottom: 14px;
    right: 22px;
    z-index: 2;
    width: auto;
    min-width: 190px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    background: rgba(20,20,24,0.7);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 0.98rem;
    font-weight: 600;
    text-align: right;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    box-sizing: border-box;
  }

  /* bottom player bar: volume + track info, like sebyx.xyz */
  .player-bar {
    position: fixed;
    bottom: 14px;
    left: 14px;
    z-index: 2;
    width: fit-content;
    min-width: 190px;
    max-width: calc(100vw - 250px);
    height: 48px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(20,20,24,0.65);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 8px 18px;
    backdrop-filter: blur(6px);
    box-sizing: border-box;
  }
  .vol { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; flex-shrink: 0; }
  .vol input { width: 70px; accent-color: rgb(54,181,38); }
  .mute-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
    transition: opacity .15s ease;
  }
  .mute-btn:hover { opacity: 0.75; }
  .mute-btn svg { width: 18px; height: 18px; }
  .mute-btn .wave { transition: opacity .15s ease; }
  .mute-btn .mute-x { opacity: 0; transition: opacity .15s ease; }
  .mute-btn.is-muted .wave { opacity: 0; }
  .mute-btn.is-muted .mute-x { opacity: 1; }
  .track {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    opacity: 0.9;
    white-space: nowrap;
    user-select: none;
  }
  .track span.title { white-space: nowrap; }
  .eq { display: flex; align-items: flex-end; gap: 2px; height: 12px; opacity: 0.3; transition: opacity .2s ease; }
  .eq span { width: 2px; background: var(--accent-pink); animation: eqBounce 0.9s infinite ease-in-out; }
  .eq span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .eq span:nth-child(2) { height: 100%; animation-delay: 0.15s; }
  .eq span:nth-child(3) { height: 60%; animation-delay: 0.3s; }
  .eq span:nth-child(4) { height: 85%; animation-delay: 0.45s; }
  .eq.is-muted { opacity: 0.2; }
  .eq.is-muted span { animation-play-state: paused; transform: scaleY(0.15); }
  @keyframes eqBounce { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

  ::-webkit-scrollbar { width: 0; }

  /* safe-area aware bottom spacing (iOS notch / home-indicator) */
  .player-bar, .corner-badge {
    bottom: calc(14px + env(safe-area-inset-bottom));
  }

  /* mobile optimization */
  @media (max-width: 480px) {
    .content { padding: 3vh 12px 150px; }
    .avatar { width: 92px; height: 92px; }
    .name { font-size: 1.1rem; margin-top: 16px; }
    .handle { font-size: 0.85rem; }
    .location { font-size: 0.82rem; padding: 4px 13px; margin-top: 12px; }
    .owner-badge { font-size: 0.72rem; padding: 4px 12px; margin-top: 12px; }
    .bio { font-size: 0.85rem; padding: 10px 14px; margin-top: 20px; }
    .links { margin-top: 24px; gap: 8px; }
    .link-btn { padding: 11px 14px; font-size: 0.82rem; }

    .player-bar, .corner-badge {
      height: 40px;
      padding: 6px 12px;
    }
    .player-bar { left: 8px; gap: 6px; min-width: 0; max-width: calc(100vw - 160px); }
    .corner-badge { right: 8px; font-size: 0.72rem; min-width: 0; padding: 6px 10px; }
    .vol input { width: 40px; }
    .mute-btn { width: 18px; height: 18px; }
    .mute-btn svg { width: 16px; height: 16px; }
    .track .title { display: none; }
  }

  @media (max-width: 360px) {
    .player-bar .eq { display: none; }
    .vol input { width: 34px; }
  }
  /* view counter, placed under the PROD badge */
  .view-counter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    background: rgba(20,20,24,0.7);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-sizing: border-box;
    user-select: none;
  }
  .view-counter .eye { opacity: 0.85; font-size: 0.85em; line-height: 1; }
  .view-counter #viewCount { color: rgb(54,181,38); font-weight: 700; }

  @media (max-width: 480px) {
    .view-counter { padding: 4px 12px; font-size: 0.72rem; margin-top: 10px; }
  }
</style>
</head>

  <script>
    (function() {
      var gate = document.getElementById('gate');
      var vid = document.getElementById('bgVideo');
      var audio = document.getElementById('bgAudio');
      var slider = document.getElementById('volumeSlider');
      var trackBtn = document.getElementById('trackBtn');
      var eq = document.getElementById('eq');
      var muteBtn = document.getElementById('muteBtn');
      var lastVolume = slider.value / 100;

      // page view counter (free, no backend needed)
      var viewCountEl = document.getElementById('viewCount');
      fetch('https://api.countapi.xyz/hit/apsi-gergobalaz-github-io/pageviews')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          viewCountEl.textContent = data.value.toLocaleString('hu-HU');
        })
        .catch(function() {
          viewCountEl.textContent = '—';
        });

      audio.volume = lastVolume;

      function updateEqState() {
        var muted = audio.muted || audio.paused;
        eq.classList.toggle('is-muted', muted);
        eq.style.opacity = audio.paused ? 0.3 : 1;
        muteBtn.classList.toggle('is-muted', audio.muted);
      }

      // keep the ambient video and the music in lockstep
      function syncMedia() {
        if (audio.paused || vid.paused) return;
        var drift = vid.currentTime - audio.currentTime;
        if (Math.abs(drift) > 0.25) {
          vid.currentTime = audio.currentTime;
        }
      }
      setInterval(syncMedia, 1500);

      // wait until both the video and the audio are fully loaded before
      // letting the user in, so playback starts clean and in sync
      var loadingText = document.getElementById('loadingText');
      var enterText = document.getElementById('enterText');
      var videoReady = false;
      var audioReady = false;
      var gateIsReady = false;

      function markReady() {
        if (gateIsReady) return;
        gateIsReady = true;
        loadingText.style.display = 'none';
        enterText.style.display = 'block';
        gate.classList.add('ready');
      }

      function checkReady() {
        if (videoReady && audioReady) markReady();
      }

      if (vid.readyState >= 4) {
        videoReady = true;
      } else {
        vid.addEventListener('canplaythrough', function() { videoReady = true; checkReady(); }, { once: true });
      }
      if (audio.readyState >= 4) {
        audioReady = true;
      } else {
        audio.addEventListener('canplaythrough', function() { audioReady = true; checkReady(); }, { once: true });
      }
      checkReady();

      // safety net: don't leave the visitor stuck if a file is slow/unreachable
      setTimeout(markReady, 9000);

      gate.addEventListener('click', function() {
        if (!gateIsReady) return;
        gate.classList.add('hidden');
        setTimeout(function() { gate.style.display = 'none'; }, 500);
        // start both from the same point together, in sync
        audio.currentTime = 0;
        vid.currentTime = 0;
        audio.play().catch(function() {
          // playback blocked; user can hit the track bar to retry
        });
        var p = vid.play();
        if (p !== undefined) { p.catch(function(){}); }
        updateEqState();
      });

      slider.addEventListener('input', function() {
        lastVolume = slider.value / 100;
        audio.volume = lastVolume;
      });

      muteBtn.addEventListener('click', function() {
        audio.muted = !audio.muted;
        updateEqState();
      });

      var dayEl = document.getElementById('dayBadge');
      function updateClock() {
        var now = new Date();
        var day = new Intl.DateTimeFormat('en-US', { weekday: 'long' }).format(now).toUpperCase();
        var time = new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit' }).format(now);
        dayEl.innerHTML = day + ' · ' + time + ' <span style="opacity:.5">⇄</span>';
      }
      updateClock();
      setInterval(updateClock, 1000);
    })();
  </script>
